<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>A surprise for Yash 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1d2a5b;--soft:#5b6490;--bg1:#dbe6ff;--bg2:#c9c9ff;--card:#fff;--line:#d6dcf5;--accent:#6d4aff;--ok:#1fb85a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ecff;--soft:#a9b2de;--bg1:#1a2150;--bg2:#2c2468;--card:#232a5e;--line:#3a4283}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;overflow-x:hidden}
h1,h2{font-family:"Baloo 2","Nunito",sans-serif;margin:0}
.view{display:none;max-width:560px;margin:0 auto;padding:24px 18px 48px}
.view.on{display:block}
/* builder */
.builder h1{font-size:2rem;line-height:1.1;text-align:center;margin-top:8px}
.builder .sub{text-align:center;color:var(--soft);margin:8px 0 22px}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,button:focus-visible,.balloon:focus-visible,.file:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-top:12px;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.item textarea{min-height:76px;border-radius:12px}
.file{position:relative;width:76px;height:96px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:.72rem;color:var(--soft);background-size:cover;background-position:center;cursor:pointer;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file.has{border-style:solid;color:transparent}
.row{display:flex;gap:10px;margin-top:16px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;color:#fff;background:var(--accent)}
button.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
button.big{flex:1;font-size:1.05rem}
/* play */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar button{padding:8px 14px;font-size:.85rem}
.play h2{text-align:center;font-size:1.7rem;margin-top:18px}
.count{text-align:center;color:var(--soft);margin:4px 0 0}
.sky{position:relative;height:min(62vh,520px);margin-top:10px}
.balloon{position:absolute;width:62px;height:78px;border:0;padding:0;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;cursor:pointer;box-shadow:inset -8px -10px 18px rgba(0,0,0,.12),0 10px 22px rgba(60,50,140,.18);animation:bob 3.4s ease-in-out infinite;transition:transform .12s}
.balloon::before{content:"";position:absolute;left:12px;top:10px;width:14px;height:24px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(18deg)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:70px;margin-left:-1px;background:linear-gradient(currentColor,transparent);opacity:.55}
.balloon:hover{transform:scale(1.07)}
.balloon.pop{animation:none;transform:scale(1.5);opacity:0;transition:transform .18s ease-out,opacity .18s;pointer-events:none}
@keyframes bob{50%{translate:0 -12px}}
.bit{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:40}
.confetti{position:fixed;top:-12px;width:9px;height:14px;pointer-events:none;z-index:40;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
/* polaroid */
.veil{position:fixed;inset:0;background:rgba(20,24,50,.55);display:none;place-items:center;z-index:30;padding:20px}
.veil.on{display:grid}
.polaroid{position:relative;width:min(300px,86vw);background:#fff;color:#33385a;padding:14px 14px 18px;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:drop .35s cubic-bezier(.2,1.3,.4,1)}
.polaroid img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eceffd}
.polaroid p{margin:14px 6px 0;text-align:center;line-height:1.45}
.polaroid .x{position:absolute;top:-14px;right:-14px;width:34px;height:34px;padding:0;background:var(--ink);color:var(--card)}
@keyframes drop{from{transform:rotate(var(--r)) translateY(-60px) scale(.7);opacity:0}to{transform:rotate(var(--r))}}
.polaroid{transform:rotate(var(--r))}
/* letter */
.letter{background:var(--card);border-radius:24px;padding:28px 22px;box-shadow:0 14px 40px rgba(60,50,140,.22);text-align:center;margin-top:18px;white-space:pre-line;line-height:1.6;animation:rise .6s ease-out}
.letter h2{font-size:1.8rem;margin-bottom:14px;white-space:normal}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.intro.on{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:88vh;gap:14px}.intro h1{font-size:2.6rem;line-height:1.05;margin:0}.intro p{margin:0;color:var(--soft);font-size:1.05rem;max-width:320px;line-height:1.5}.intro .cluster{position:relative;width:240px;height:150px;margin-bottom:26px}.intro .cluster .balloon{pointer-events:none}.intro button.go{font-size:1.1rem;padding:14px 30px;margin-top:10px;box-shadow:0 10px 24px rgba(109,74,255,.35)}.intro button.go:hover{transform:scale(1.04)}</style></head><body>
<main class="view intro on" id="intro"><div class="cluster" aria-hidden="true"><div class="balloon" style="left:18%;top:20px;background:radial-gradient(circle at 35% 30%,#f7d86a,#f2b94b);color:#f2b94b"></div><div class="balloon" style="left:42%;top:0;background:radial-gradient(circle at 35% 30%,#f26b6b,#d8434f);color:#d8434f;animation-delay:-1s"></div><div class="balloon" style="left:66%;top:24px;background:radial-gradient(circle at 35% 30%,#b57bec,#8b4fd6);color:#8b4fd6;animation-delay:-2s"></div></div><h1>Hey Yash 💛</h1><p>Someone made something special, just for you.</p><p>There are 5 balloons waiting. Pop each one to see what’s inside.</p><button class="go" id="open" type="button">Open your surprise</button></main><main class="view play" id="play"><div class="bar"><span></span><button class="ghost" id="replay" type="button">Replay</button></div>
<h2>Pop the balloons, Yash 🎈</h2><p class="count" id="count"></p><div class="sky" id="sky"></div><div id="final"></div></main>
<div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="Surprise message"><div class="polaroid" id="pol"><button class="x" id="close" aria-label="Close">✕</button><img id="pimg" alt=""><p id="ptxt"></p></div></div>

var COLORS=["#f7d86a,#f2b94b","#f26b6b,#d8434f","#b57bec,#8b4fd6","#f29a74,#e0704f","#f06a93,#d83e72"];
var left=0,done=false;
function upd(){$("count").textContent=left>0?left+(left===1?" surprise":" surprises")+" remaining":"All popped!"}
function start(){
  done=false;$("final").innerHTML="";var sky=$("sky");sky.innerHTML="";left=CARDS.length;upd();
  var cols=3,rows=Math.ceil(CARDS.length/cols);
  CARDS.forEach(function(it,i){
    var c=i%cols,r=Math.floor(i/cols),b=document.createElement("button"),col=COLORS[i%COLORS.length].split(",");
    b.className="balloon";b.setAttribute("aria-label","Balloon "+(i+1));
    b.style.background="radial-gradient(circle at 35% 30%,"+col[0]+","+col[1]+")";b.style.color=col[1];
    b.style.left=(c+.5)*(100/cols)+(Math.random()*8-4)+"%";b.style.top=(r*(100/rows)+Math.random()*6)+"%";
    b.style.marginLeft="-31px";b.style.animationDelay=(-Math.random()*3)+"s";
    b.onclick=function(){pop(b,it,col[1])};sky.appendChild(b);
  });
}
function pop(b,it,col){
  var rc=b.getBoundingClientRect(),x=rc.left+rc.width/2,y=rc.top+rc.height/2;b.classList.add("pop");
  for(var i=0;i<14;i++){var p=document.createElement("span");p.className="bit";p.style.background=col;p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);
    var a=Math.PI*2*i/14,d=40+Math.random()*50;
    p.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)",opacity:0}],{duration:520,easing:"ease-out"}).onfinish=(function(e){return function(){e.remove()}})(p);}
  setTimeout(function(){card(it)},220);left--;upd();
}
function card(it){
  var img=$("pimg");if(it[0]){img.src=it[0];img.style.display="block"}else{img.removeAttribute("src");img.style.display="none"}
  $("ptxt").textContent=it[1];$("pol").style.setProperty("--r",(Math.random()*10-5)+"deg");$("veil").classList.add("on");$("close").focus();
}
function closeCard(){$("veil").classList.remove("on");if(left===0&&!done)finale()}
$("close").onclick=closeCard;$("veil").onclick=function(e){if(e.target===this)closeCard()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("veil").classList.contains("on"))closeCard()});
function finale(){
  done=true;var h=document.createElement("div");h.className="letter";
  var t=document.createElement("h2");t.textContent="Happy Men’s Day, Yash ✨";h.appendChild(t);h.appendChild(document.createTextNode(LETTER));
  $("final").appendChild(h);h.scrollIntoView({behavior:"smooth",block:"center"});
  var cs=["#f7d86a","#f26b6b","#b57bec","#6ec1ff","#f06a93","#4ddb9a"];
  for(var i=0;i<60;i++){var c=document.createElement("span");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cs[i%cs.length];
    c.style.animationDuration=(2.5+Math.random()*2.5)+"s";c.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(c);
    setTimeout((function(e){return function(){e.remove()}})(c),6500);}
}
$("replay").onclick=start;$("open").onclick=function(){$("intro").classList.remove("on");$("play").classList.add("on");window.scrollTo(0,0);start()};
